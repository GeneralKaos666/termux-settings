name: Feature request
description: Suggest a change to a screen, a command or the theme format.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is awkward or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the app do instead? Screens, keys and command-line flags are all useful detail.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Preset Themes
        - Terminal Colors
        - App Theme
        - Fonts
        - Command line
        - Packaging or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, scripts or workarounds you tried, and why they were not enough.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked `README.md` and the existing issues.
          required: true
