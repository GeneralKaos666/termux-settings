# Dependency policy checked by `cargo deny check` in CI.
#
# The advisory database is the same one the scheduled RustSec scan uses; this
# adds license, duplicate and source checks that the advisory scan cannot see.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Every license in the current dependency graph, including the transitive
# font/crypto crates. Adding a dependency with a new license fails CI until the
# license is reviewed and listed here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
